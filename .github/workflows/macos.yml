name: go-macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: cloudengio/.github/.github/workflows/go-test-multimod.yml@main
    with:
      runner: | # use for self-hosted runners
        [ "self-hosted", "macos", "arm64" ]
      #runner: |
      #  [ "macos-latest" ]
      go-versions: |
        [ "1.26.x" ]
